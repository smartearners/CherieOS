name: Build and Deploy CherieOS

on:
  workflow_dispatch:
    inputs:
      os_name:
        description: 'CherieOS'
        required: true
        default: 'cherieos'
      os_banner:
        description: 'Cherie Greetings to you'
        required: true
        default: 'Welcome to CherieOS (Instant Sandbox)'

# Permissions required for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev bison flex libssl-dev bc rsync file wget cpio e2fsprogs

      - name: Download Buildroot
        run: |
          git clone --depth 1 https://github.com/buildroot/buildroot.git
          cd buildroot

      - name: Configure Target & Custom Prompt
        run: |
          cd buildroot

          # 1. Base 32-bit x86 configuration
          make qemu_x86_defconfig
          
          # --- SPEED BOOST: Use pre-built compiler ---
          ./utils/config --disable BR2_TOOLCHAIN_BUILDROOT
          ./utils/config --enable BR2_TOOLCHAIN_EXTERNAL
          ./utils/config --enable BR2_TOOLCHAIN_EXTERNAL_BOOTLIN
          ./utils/config --enable BR2_TOOLCHAIN_EXTERNAL_BOOTLIN_X86_I686_GLIBC_STABLE
          # ----------------------------------------------------------------------
          # --- ENABLE EXTRA NATIVE TOOLS ---
          ./utils/config --enable BR2_PACKAGE_NANO               # Classic text editor
          ./utils/config --enable BR2_PACKAGE_HTOP               # Visual process & RAM monitor
          ./utils/config --enable BR2_PACKAGE_TREE               # Visual directory tree viewer
          ./utils/config --enable BR2_PACKAGE_CURL               # Network download tool
          ./utils/config --enable BR2_PACKAGE_OPENSSH_CLIENT     # SSH into servers from browser
          # ---------------------------------

          # 2. Set Hostname
          ./utils/config --set-str BR2_TARGET_GENERIC_HOSTNAME "${{ github.event.inputs.os_name }}"
          
          # 3. Auto-login as root directly to the shell
          ./utils/config --set-str BR2_TARGET_GENERIC_GETTY_OPTIONS "-n -l /bin/sh"

          # 4. Create custom overlay folder
          mkdir -p custom_overlay/etc

          # Custom /etc/issue
          echo "=====================================================" > custom_overlay/etc/issue
          echo "       ___ _               _      ___  ____  " >> custom_overlay/etc/issue
          echo "      / __| |_  ___ _ _ (_)___  / _ \/ ___| " >> custom_overlay/etc/issue
          echo "     | (__| ' \/ -_) '_|| / -_)| (_) \___ \ " >> custom_overlay/etc/issue
          echo "      \___|_||_\___|_|  |_\___| \___/|____/ " >> custom_overlay/etc/issue
          echo "                                            " >> custom_overlay/etc/issue
          echo "         CherieOS - Sandboxed Web Terminal   " >> custom_overlay/etc/issue
          echo "=====================================================" >> custom_overlay/etc/issue

          # Custom /etc/profile
          echo "export PATH=/bin:/sbin:/usr/bin:/usr/sbin" > custom_overlay/etc/profile
          echo "clear" >> custom_overlay/etc/profile
          echo "cat /etc/issue" >> custom_overlay/etc/profile
          echo "export PS1='\h:\w# '" >> custom_overlay/etc/profile

          ./utils/config --set-str BR2_ROOTFS_OVERLAY "custom_overlay"

          # 5. Embed root filesystem directly into the kernel
          ./utils/config --enable BR2_TARGET_ROOTFS_INITRAMFS

          make olddefconfig

      - name: Compile Operating System
        run: |
          cd buildroot
          make -j$(nproc)

      - name: Bundle Web Assets for GitHub Pages
        run: |
          mkdir -p public
          cp index.html public/
          cp libv86.js public/
          cp v86.wasm public/
          cp -r bios public/
          cp buildroot/output/images/bzImage public/

          # If tools.img was committed, use it; otherwise create a default one
          if [ -f tools.img ]; then
            cp tools.img public/
          else
            mkdir -p empty_tools
            mkfs.ext4 -d empty_tools -F public/tools.img 16M
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4